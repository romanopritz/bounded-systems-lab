name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Verify lock file
        run: uv lock --check

      - name: Check Python formatting and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Check Python types
        run: uv run mypy src tests

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          cd "$RUNNER_TEMP"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" "$base_url/$archive"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output checksums.txt "$base_url/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep "  $archive$" checksums.txt | sha256sum --check --strict -
          tar --extract --gzip --file "$archive" actionlint
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check GitHub Actions workflows
        run: actionlint

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest -q

  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.4

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: "0.8.0"
        run: |
          set -euo pipefail
          archive="kubeconform-linux-amd64.tar.gz"
          base_url="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}"
          cd "$RUNNER_TEMP"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" "$base_url/$archive"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output checksums.txt "$base_url/CHECKSUMS"
          grep "  $archive$" checksums.txt | sha256sum --check --strict -
          tar --extract --gzip --file "$archive" kubeconform
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Render and validate Kubernetes manifests
        run: |
          kubectl kustomize platform/kubernetes/base > "$RUNNER_TEMP/base.yaml"
          kubectl kustomize platform/kubernetes/overlays/ghcr > "$RUNNER_TEMP/ghcr.yaml"
          kubectl kustomize platform/kubernetes/overlays/gitops > "$RUNNER_TEMP/gitops.yaml"
          kubectl kustomize platform/observability/base > "$RUNNER_TEMP/observability-base.yaml"
          kubectl kustomize platform/observability/overlays/gitops > "$RUNNER_TEMP/observability-gitops.yaml"
          kubectl kustomize platform/gitops/control-plane > "$RUNNER_TEMP/argocd-control-plane.yaml"
          kubectl kustomize platform/gitops/application > "$RUNNER_TEMP/argocd-application.yaml"
          kubeconform -strict -summary \
            "$RUNNER_TEMP/base.yaml" \
            "$RUNNER_TEMP/ghcr.yaml" \
            "$RUNNER_TEMP/gitops.yaml" \
            "$RUNNER_TEMP/observability-base.yaml" \
            "$RUNNER_TEMP/observability-gitops.yaml"
          kubeconform -strict -skip CustomResourceDefinition -summary \
            "$RUNNER_TEMP/argocd-control-plane.yaml"
          kubeconform -strict -ignore-missing-schemas -summary \
            "$RUNNER_TEMP/argocd-application.yaml"

      - name: Validate monitoring configuration and rules
        run: |
          docker run --rm --entrypoint /bin/promtool \
            --volume "$PWD/platform/observability/base/config:/etc/prometheus:ro" \
            quay.io/prometheus/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool \
            --volume "$PWD/platform/observability:/work:ro" \
            --workdir /work/tests \
            quay.io/prometheus/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0 \
            test rules rules.test.yml
          docker run --rm --entrypoint /bin/amtool \
            --volume "$PWD/platform/observability/base/config:/etc/alertmanager:ro" \
            quay.io/prometheus/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d \
            check-config /etc/alertmanager/alertmanager.yml
          jq --exit-status empty \
            platform/observability/base/dashboards/bounded-systems-slo.json

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build container
        uses: docker/build-push-action@2ca78c6bec76527009825f31aae0532b4d40d820 # v6
        with:
          context: .
          load: true
          push: false
          tags: bounded-systems-lab:ci

      - name: Scan container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bounded-systems-lab:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL
          version: v0.74.0
