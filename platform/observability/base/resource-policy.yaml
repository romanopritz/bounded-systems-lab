apiVersion: v1
kind: ResourceQuota
metadata:
  name: observability-budget
  namespace: observability
spec:
  hard:
    requests.cpu: 750m
    requests.memory: 1Gi
    requests.ephemeral-storage: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    limits.ephemeral-storage: 3Gi
    pods: "6"
    services: "6"
    configmaps: "15"
    secrets: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: observability-container-defaults
  namespace: observability
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
        ephemeral-storage: 64Mi
      default:
        cpu: 250m
        memory: 256Mi
        ephemeral-storage: 512Mi
      max:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 2Gi
