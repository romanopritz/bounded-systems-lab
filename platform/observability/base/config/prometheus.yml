global:
  scrape_interval: 30s
  scrape_timeout: 5s
  evaluation_interval: 30s
  external_labels:
    environment: bounded-lab

rule_files:
  - /etc/prometheus/slo-rules.yml
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - scheme: http
      timeout: 5s
      static_configs:
        - targets:
            - alertmanager.observability.svc.cluster.local:9093

scrape_configs:
  - job_name: bounded-systems-lab
    metrics_path: /metrics
    scheme: http
    dns_sd_configs:
      - names:
          - bounded-systems-lab-metrics.bounded-lab.svc.cluster.local
        type: A
        port: 8000
        refresh_interval: 30s
