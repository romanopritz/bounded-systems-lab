apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-workload-manager
  namespace: bounded-lab
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - limitranges
      - resourcequotas
      - serviceaccounts
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - endpoints
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-workload-manager
  namespace: bounded-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-workload-manager
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd
