apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bounded-systems-lab
  namespace: argocd
spec:
  project: bounded-systems-lab
  destination:
    namespace: bounded-lab
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/romanopritz/bounded-systems-lab.git
    targetRevision: main
    path: platform/kubernetes/overlays/gitops
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
  revisionHistoryLimit: 5
