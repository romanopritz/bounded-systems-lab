[project]
name = "bounded-systems-lab"
version = "0.1.0"
description = "Bounded async work and production-minded platform examples."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.118.0",
    "prometheus-client>=0.23.0",
    "uvicorn>=0.37.0",
]

[project.urls]
Repository = "https://github.com/romanopritz/bounded-systems-lab"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
